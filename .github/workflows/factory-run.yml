name: Factory Run

# Manual dispatch only - a Factory Agent never initiates its own build
# (implementation/agents/factory-agent.md: "never initiates a build on
# its own, only responds to a routed escalation"). A human (or, later,
# an orchestrating Planning Agent step with its own separate approval)
# triggers this explicitly, naming the exact Task Document and write
# scope.
on:
  workflow_dispatch:
    inputs:
      task_file:
        description: "Path to the Factory Run Task Document (e.g. implementation/factory-runs/build-bi-report/task-factory-run-build-bi-report-skill.md)"
        required: true
      agent_file:
        description: "Path to the compiled agent definition"
        required: true
        default: "implementation/agents/factory-agent.md"
      allow_prefix:
        description: "This run's write scope - a single path prefix, e.g. implementation/factory-runs/build-bi-report/sandbox/"
        required: true

# Explicitly minimal permissions for the workflow's own GITHUB_TOKEN.
# The real write authority comes from the separately-minted GitHub App
# installation token below, scoped by the App's own permission grant
# (Contents + PRs read-write, Metadata read-only, this repo only) - not
# from this default token, which is left read-only on purpose.
permissions:
  contents: read

jobs:
  factory-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic pyjwt cryptography requests

      - name: Write App private key to a runner-local temp file
        run: |
          umask 077
          echo "${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}" > "$RUNNER_TEMP/app-key.pem"

      - name: Mint installation token
        id: mint
        env:
          GOVERNANCE_APP_CLIENT_ID: ${{ secrets.GOVERNANCE_APP_CLIENT_ID }}
          GOVERNANCE_APP_INSTALLATION_ID: ${{ secrets.GOVERNANCE_APP_INSTALLATION_ID }}
          GOVERNANCE_APP_PEM_PATH: ${{ runner.temp }}/app-key.pem
        run: |
          TOKEN=$(python3 implementation/github-auth/mint-token.py)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run the Factory Agent
        id: run_agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 implementation/github-auth/run-factory-agent.py \
            --task-file "${{ inputs.task_file }}" \
            --agent-file "${{ inputs.agent_file }}" \
            --allow-prefix "${{ inputs.allow_prefix }}"

      - name: Mechanical scope check (required gate, not advisory)
        run: |
          python3 implementation/github-auth/scope-check.py "${{ inputs.allow_prefix }}"
          # Non-zero exit here fails the job before anything is
          # committed or pushed - an out-of-scope write never reaches
          # a PR, let alone main, regardless of what run_agent's own
          # transcript claimed it did.

      - name: Open a PR with the candidate, if anything changed
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes produced by this run - nothing to open a PR for."
            exit 0
          fi
          git config user.name "governance-factory-agent[bot]"
          git config user.email "governance-factory-agent[bot]@users.noreply.github.com"
          BRANCH="factory-run/$(basename "${{ inputs.allow_prefix }}")-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Factory Run: candidate from ${{ inputs.task_file }}

Automated Factory Run via GitHub Actions (Tier 2 isolation - this runner
has no path back to any developer's machine or session; scope was
enforced both at the write_file tool layer and by scope-check.py as a
hard gate above, not only reported by the run itself).

Write scope: ${{ inputs.allow_prefix }}
Task: ${{ inputs.task_file }}
Agent: ${{ inputs.agent_file }}

This PR requires human Sandbox/Eval review and approval before merge -
per engagements/13-factory.md, a Factory Run never self-approves."
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Factory Run candidate: ${{ inputs.task_file }}" \
            --body "Automated candidate from the Factory Run pipeline. **Do not merge without running this candidate's Eval Suite and getting real human Sandbox/Approval sign-off** - this PR existing is not itself approval of anything, per CCAR-1/CCAR-2." \
            --base main \
            --head "$BRANCH"
