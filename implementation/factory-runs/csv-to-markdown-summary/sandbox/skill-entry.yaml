instructions: |
  Purpose: given an input CSV file path and an output markdown file
  path, produce a markdown file containing a markdown table of the
  CSV's rows and a one-line summary of row count and column count.

  Procedure:
    1. Confirm the input CSV file exists and is readable.
    2. Run the bundled script:
         python3 csv_to_markdown_summary.py <input.csv> <output.md>
    3. Confirm the output markdown file was created and is non-empty.
    4. Report the output file path, the row count, and the column
       count back to the caller.

  Do not hand-transcribe the CSV's contents into the markdown table
  yourself - always invoke the script so the table is generated
  directly from the actual file contents (avoids transcription drift
  or fabricated rows).

  The script (csv_to_markdown_summary.py, bundled alongside this entry
  in the same Sandbox location) is standard-library-only Python 3: it
  uses csv, sys, and pathlib. No third-party packages, no network
  calls, no writes outside the given output path.

script_ref: implementation/factory-runs/csv-to-markdown-summary/sandbox/csv_to_markdown_summary.py
