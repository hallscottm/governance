skill_id: skill-lib/dq-metrics-dummy-data-generator-v1
name: Data Quality Metrics Dummy Data Generator
description: >
  Generates a synthetic "weekly data-quality metrics" CSV shaped like a
  real BI/data-quality export: one row per (check_name, table_name,
  week_ending), with columns check_name, table_name, week_ending,
  pass_count, fail_count, pass_rate. Takes three parameters - number of
  weeks to simulate, number of distinct (check, table) pairs, and a
  random seed. The same seed (with the same weeks/pairs) always
  produces byte-identical output, for eval reproducibility. Pass rates
  are modeled to look like real data-quality metrics (mostly high, with
  small week-to-week variance and occasional sharp "bad weeks" per
  pair) rather than uniformly random values. Runs the bundled script to
  produce the output file; does not fabricate row contents from memory
  or from any live/production data source - this is synthetic test
  input only, not a substitute for a real data-quality-checks
  connection.
